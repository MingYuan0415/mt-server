name: mt-server-lan

services:
  mt-server:
    image: ${MT_SERVER_IMAGE:-ghcr.io/mingyuan0415/mt-server:v0.1.1}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=1m,mode=1777
    ports:
      - "${MT_HTTP_PORT:-8080}:8080"
    environment:
      MT_LISTEN_ADDR: ":8080"
      MT_LOG_LEVEL: ${MT_LOG_LEVEL:-info}
      MT_STATE_DIR: /var/lib/mt-server
      MT_ADMIN_ALLOW_INSECURE_HTTP: "true"
    volumes:
      - mt-server-state:/var/lib/mt-server
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mt-server-state:
